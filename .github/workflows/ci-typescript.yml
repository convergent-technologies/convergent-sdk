name: CI TypeScript

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # release-typescript.yml runs this same job as its pre-publish gate.
  workflow_call:

concurrency:
  group: ci-typescript-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# No step restores a GitHub Actions cache; see weekly.yml for why.
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The oldest Node.js that package.json's engines field allows. The packed
      # package also runs on it below. The build tools need a newer Node.js.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.15.0"
          package-manager-cache: false
      - name: Remember the oldest supported Node.js
        run: echo "OLDEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install the pnpm package.json names
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Run the packed package on the oldest supported Node.js
        run: CONSUMER_NODE="$OLDEST_NODE" pnpm test
