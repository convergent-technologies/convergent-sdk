name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs these same jobs as its pre-publish gate.
  workflow_call:

env:
  UV_VERSION: "0.11.14"

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}
      - run: uv run ruff check src tests
      - run: uv run pyright
      - run: uv run pytest

  # The artifacts a customer installs: metadata must render (twine) and the
  # wheel must hold exactly the package (check-wheel-contents).
  artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - run: uv build
      - run: uvx 'twine==7.0.0' check --strict dist/*
      - run: uvx 'check-wheel-contents==0.6.3' dist/*.whl

  # The suite against the oldest OpenTelemetry train the package metadata allows.
  # Two tests need newer releases and are excluded here: drop counting needs
  # BatchSpanProcessor's meter_provider (1.41+), and the pydantic-ai interop
  # tests need pydantic-ai 2.x, which needs a newer train.
  floor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - name: Install at the floor
        run: |
          uv venv .venv-floor
          uv pip install --python .venv-floor --no-deps .
          uv pip install --python .venv-floor pytest \
            "opentelemetry-api==1.25.0" \
            "opentelemetry-sdk==1.25.0" \
            "opentelemetry-exporter-otlp-proto-http==1.25.0" \
            "opentelemetry-instrumentation==0.46b0"
      - name: Run the suite at the floor
        run: |
          .venv-floor/bin/python -m pytest tests \
            --ignore tests/test_sdk_transport.py \
            --deselect tests/test_sdk_destinations.py::test_flush_reports_the_spans_a_full_queue_threw_away
