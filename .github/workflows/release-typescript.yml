# Publishes the TypeScript SDK to npm and posts the GitHub Release.
#
# Pushing a tag like typescript-v0.1.0 runs ci-typescript.yml and the release
# preflight (.github/scripts/release-preflight.sh: the tag names the version in
# typescript/package.json, is on main, and typescript/CHANGELOG.md has its
# section). It then packs the package once, publishes that tarball through npm
# trusted publishing (OIDC, environment "npm"), and creates a GitHub Release
# whose notes are that changelog section. The preflight runs before the
# publish, so a mismatch publishes nothing. Python releases use python-v* tags
# in release.yml.
#
# To release, land a commit on main that bumps the version in
# typescript/package.json and adds its section to typescript/CHANGELOG.md,
# then push typescript-v<version> on that commit.
#
# One-time setup, done by a person before the first release, in this order:
# 1. In this repository's settings, create the environment "npm" with the same
#    required reviewers as "pypi", and limit its deployments to tags matching
#    typescript-v*.
# 2. On npmjs.com, in the convergent-sdk package settings, add a trusted
#    publisher: GitHub Actions, organization convergent-technologies,
#    repository convergent-sdk, workflow release-typescript.yml, environment npm.
# The order matters. A job that names a missing environment creates it with no
# protection, so a tag pushed before step 1 could publish without review.
#
# Trusted publishing needs npm 11.5.1 or newer. Node.js 24 bundles it and
# Node.js 22 does not, so the publish job runs on 24. No npm token exists.
name: Release TypeScript

on:
  push:
    tags: ["typescript-v*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci-typescript.yml

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Run the release preflight
        working-directory: .
        run: |
          version=$(node -p 'require("./typescript/package.json").version')
          bash .github/scripts/release-preflight.sh typescript typescript-v "$version" > "$RUNNER_TEMP/release-notes.md"
      - name: Install the pnpm package.json names
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm pack --out "$RUNNER_TEMP/convergent-sdk.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/convergent-sdk.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm publish ./convergent-sdk.tgz --provenance --access public

  github-release:
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
      # --latest=false keeps the newest Python release as the repository's
      # latest release.
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md \
            --verify-tag --latest=false
