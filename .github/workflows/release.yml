# Publishes the Python SDK to PyPI and posts the GitHub Release.
#
# Pushing a tag like v0.0.5 runs the full CI suite, checks the tag names the
# version in python/pyproject.toml, builds once, publishes those exact files
# through trusted publishing (OIDC, environment "pypi"), and creates a GitHub
# Release whose notes are that version's section of python/CHANGELOG.md.
# workflow_dispatch stays as a fallback that builds and publishes without a
# tag; it skips the tag check and the GitHub Release.
#
# The publish step uses pypa/gh-action-pypi-publish because it generates PEP
# 740 attestations; `uv publish` uploads attestations but does not create them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.14"

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check the tag names pyproject's version
        if: github.ref_type == 'tag'
        run: |
          python3 - <<'PY'
          import os, sys, tomllib
          version = tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              sys.exit(f"tag {tag} does not name pyproject version {version}")
          print(f"tag {tag} names version {version}")
          PY
      - name: Install uv
        run: curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
      - run: uv build
        working-directory: python
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@a892a5a61159132606e93a2fa6f4358831b04d26 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    if: github.ref_type == 'tag'
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$version" '
            $0 == "## " ver { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' python/CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "python/CHANGELOG.md has no '## $version' section" >&2
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$notes" --verify-tag
