# Static analysis for the workflows themselves. zizmor catches the GitHub
# Actions failure classes that are easy to introduce and hard to spot in
# review: template injection into run blocks, credential persistence,
# executing untrusted pull request code.
name: Workflow lint

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        run: |
          curl -LsSf "https://astral.sh/uv/0.11.14/install.sh" | sh
          export PATH="$HOME/.local/bin:$PATH"
          uvx zizmor --min-severity medium .github/workflows/
